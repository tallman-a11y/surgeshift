<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Chrome/silver border gradient -->
    <linearGradient id="ss-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#dde0f2"/>
      <stop offset="18%"  stop-color="#8890bc"/>
      <stop offset="42%"  stop-color="#cdd0e6"/>
      <stop offset="60%"  stop-color="#6068a0"/>
      <stop offset="80%"  stop-color="#aab0cc"/>
      <stop offset="100%" stop-color="#7880a8"/>
    </linearGradient>

    <!-- Inner chrome highlight (top-left rim) -->
    <linearGradient id="ss-chrome-hi" x1="0%" y1="0%" x2="60%" y2="60%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Dark navy interior -->
    <radialGradient id="ss-navy" cx="36%" cy="30%" r="72%">
      <stop offset="0%"   stop-color="#1c2268"/>
      <stop offset="55%"  stop-color="#0e1245"/>
      <stop offset="100%" stop-color="#060a1c"/>
    </radialGradient>

    <!-- Purple gradient for S letters -->
    <linearGradient id="ss-s" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#e870ff"/>
      <stop offset="55%"  stop-color="#aa30e0"/>
      <stop offset="100%" stop-color="#7020b8"/>
    </linearGradient>

    <!-- Bar chart gradient (bottom-dark → top-bright) -->
    <linearGradient id="ss-bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#7028c0"/>
      <stop offset="100%" stop-color="#e068ff"/>
    </linearGradient>

    <!-- Diagonal flash line gradient -->
    <linearGradient id="ss-flash" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#9030d8" stop-opacity="0"/>
      <stop offset="38%"  stop-color="#d060ff" stop-opacity="0.85"/>
      <stop offset="52%"  stop-color="#ffffff"  stop-opacity="1"/>
      <stop offset="100%" stop-color="#c050f0"  stop-opacity="0"/>
    </linearGradient>

    <!-- Soft purple glow for letters -->
    <filter id="ss-sglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Bright glow for flash line + sparkle -->
    <filter id="ss-flash-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip to interior bounds -->
    <clipPath id="ss-clip">
      <rect x="20" y="20" width="160" height="160" rx="33"/>
    </clipPath>
  </defs>

  <!-- Chrome outer border -->
  <rect x="8" y="8" width="184" height="184" rx="42" fill="url(#ss-chrome)"/>
  <!-- Rim highlight -->
  <rect x="8" y="8" width="184" height="184" rx="42" fill="url(#ss-chrome-hi)"/>

  <!-- Navy interior fill -->
  <rect x="16" y="16" width="168" height="168" rx="36" fill="url(#ss-navy)"/>

  <!-- All interior content clipped -->
  <g clip-path="url(#ss-clip)">

    <!-- Subtle globe grid arcs (background texture) -->
    <ellipse cx="100" cy="172" rx="95" ry="58" fill="none" stroke="#2a3a9a" stroke-width="1.2" opacity="0.3"/>
    <ellipse cx="100" cy="172" rx="62" ry="38" fill="none" stroke="#2a3a9a" stroke-width="1"   opacity="0.2"/>
    <ellipse cx="100" cy="172" rx="30" ry="18" fill="none" stroke="#2a3a9a" stroke-width="0.8" opacity="0.15"/>

    <!-- Left S -->
    <text
      x="52" y="136"
      text-anchor="middle"
      font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="94"
      fill="url(#ss-s)"
      filter="url(#ss-sglow)">S</text>

    <!-- Right S -->
    <text
      x="148" y="136"
      text-anchor="middle"
      font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="94"
      fill="url(#ss-s)"
      filter="url(#ss-sglow)">S</text>

    <!-- Signal / surge bars (5 bars, ascending left→right) -->
    <g fill="url(#ss-bar)" opacity="0.92">
      <rect x="64"  y="126" width="8" height="20" rx="1.5"/>
      <rect x="76"  y="113" width="8" height="33" rx="1.5"/>
      <rect x="88"  y="98"  width="8" height="48" rx="1.5"/>
      <rect x="100" y="83"  width="8" height="63" rx="1.5"/>
      <rect x="112" y="66"  width="8" height="80" rx="1.5"/>
    </g>

    <!-- Diagonal surge / flash line -->
    <line x1="60" y1="156" x2="128" y2="54"
          stroke="url(#ss-flash)"
          stroke-width="4"
          stroke-linecap="round"
          filter="url(#ss-flash-glow)"/>

    <!-- Sparkle at tip of flash -->
    <g filter="url(#ss-flash-glow)">
      <circle cx="130" cy="52" r="2.5" fill="#ffffff"/>
      <!-- star arms -->
      <line x1="130" y1="44" x2="130" y2="50" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="138" y1="52" x2="132" y2="52" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="135" y1="47" x2="131" y2="51" stroke="#ffffff" stroke-width="1"   stroke-linecap="round"/>
      <line x1="135" y1="57" x2="131" y2="53" stroke="#ffffff" stroke-width="1"   stroke-linecap="round"/>
    </g>

  </g>
</svg>
